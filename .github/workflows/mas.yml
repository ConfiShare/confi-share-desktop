name: Build Mac App Store Package

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: Upload the validated .pkg to App Store Connect (does not submit for review)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-mas:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required MAS secrets
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          MAS_CERT_PW: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAS_INSTALLER_CERT_PW: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          MAS_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          MISSING=0
          [ -n "$MAS_CERT_P12" ] || { echo "::error::Missing secret MAS_CERTIFICATE_P12_BASE64"; MISSING=1; }
          [ -n "$MAS_CERT_PW" ] || { echo "::error::Missing secret MAS_CERTIFICATE_PASSWORD"; MISSING=1; }
          [ -n "$MAS_PROFILE" ] || { echo "::error::Missing secret MAS_PROVISIONING_PROFILE_BASE64"; MISSING=1; }
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Create the Mac App Distribution .p12, the Mac App Store provisioning profile, and optionally a separate Mac Installer Distribution .p12. See docs/MAC_APP_STORE.md."
            exit 1
          fi
          if [ -z "$MAS_INSTALLER_CERT_P12" ]; then
            echo "::warning::MAS_INSTALLER_CERTIFICATE_P12_BASE64 is not set. The installer identity must be in the keychain or combined into MAS_CERTIFICATE_P12_BASE64."
          elif [ -z "$MAS_INSTALLER_CERT_PW" ]; then
            echo "::warning::MAS_INSTALLER_CERTIFICATE_PASSWORD is empty. This is only okay if the installer key has no password."
          fi

      - name: Write provisioning profile
        env:
          MAS_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p build
          node -e "require('fs').writeFileSync('build/embedded.provisionprofile', Buffer.from(process.env.MAS_PROFILE, 'base64'))"
          security cms -D -i build/embedded.provisionprofile > /tmp/mas-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/mas-profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' /tmp/mas-profile.plist || true

      - name: Configure separate installer identity
        env:
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAS_INSTALLER_CERT_PW: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$MAS_INSTALLER_CERT_P12" ]; then
            {
              echo "CSC_INSTALLER_LINK=$MAS_INSTALLER_CERT_P12"
              echo "CSC_INSTALLER_KEY_PASSWORD=$MAS_INSTALLER_CERT_PW"
            } >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-darwin-arm64@4.57.1 lightningcss-darwin-arm64@1.30.2 @tailwindcss/oxide-darwin-arm64@4.1.18

      - name: Preflight MAS configuration
        env:
          CSC_LINK: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
        run: npm run mas:preflight

      - name: Build signed MAS .pkg
        env:
          CSC_LINK: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
        run: npm run build:mas

      - name: Validate signing, sandbox, profile, and package
        run: npm run validate:mas

      - name: Generate SHA-256 checksum
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          cd "release-mas/$VERSION/mas-universal"
          shasum -a 256 ./*.pkg > "ConfiShare-Mac-AppStore-$VERSION-SHA256SUMS.txt"
          cat "ConfiShare-Mac-AppStore-$VERSION-SHA256SUMS.txt"

      - name: Upload signed MAS package artifact for manual App Store Connect upload
        uses: actions/upload-artifact@v4
        with:
          name: confishare-mac-app-store-pkg
          path: |
            release-mas/*/mas-universal/*.pkg
            release-mas/*/mas-universal/ConfiShare-mas-validation.txt
            release-mas/*/mas-universal/ConfiShare-Mac-AppStore-*-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload .pkg to App Store Connect
        if: ${{ inputs.upload_to_app_store_connect }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -e
          PKG=$(find release-mas -path '*/mas-universal/*.pkg' -print -quit)
          [ -n "$PKG" ] || { echo "::error::Signed .pkg not found"; exit 1; }
          echo "Uploading $PKG"

          HAS_ASC_KEY=0
          [ -n "$ASC_API_KEY_ID" ] && [ -n "$ASC_API_ISSUER_ID" ] && [ -n "$ASC_API_KEY_P8_BASE64" ] && HAS_ASC_KEY=1

          if [ "$HAS_ASC_KEY" -eq 1 ]; then
            KEY_DIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEY_DIR"
            node -e "require('fs').writeFileSync(process.env.HOME + '/.appstoreconnect/private_keys/AuthKey_' + process.env.ASC_API_KEY_ID + '.p8', Buffer.from(process.env.ASC_API_KEY_P8_BASE64, 'base64'))"
            chmod 600 "$KEY_DIR/AuthKey_$ASC_API_KEY_ID.p8"
            trap 'rm -f "$KEY_DIR/AuthKey_$ASC_API_KEY_ID.p8"' EXIT
            xcrun altool --upload-app -f "$PKG" -t macos --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" --output-format normal
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            xcrun altool --upload-app -f "$PKG" -t macos -u "$APPLE_ID" -p "$APPLE_APP_SPECIFIC_PASSWORD" --output-format normal
          else
            echo "::error::Configure either ASC_API_KEY_ID + ASC_API_ISSUER_ID + ASC_API_KEY_P8_BASE64, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD."
            exit 1
          fi

      - name: Reminder
        run: |
          if [ "${{ inputs.upload_to_app_store_connect }}" = "true" ]; then
            echo "The .pkg was uploaded to App Store Connect for TestFlight processing. It was not submitted for review."
          else
            echo "The .pkg artifact is signed but was not uploaded."
            echo "Re-run with upload_to_app_store_connect=true, or upload it with Transporter."
          fi
          echo "Do not submit for review until docs/MAS_TEST_PLAN.md has passed on a mas-dev or TestFlight build."
