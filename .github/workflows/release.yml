name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach builds to (used only for manual runs)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=optional
          npm install --no-save --omit=optional @rollup/rollup-win32-x64-msvc@4.57.1 lightningcss-win32-x64-msvc@1.30.2 @tailwindcss/oxide-win32-x64-msvc@4.1.18

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: confishare-windows-installer
          path: release/*/ConfiShare-*-Setup.exe

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release/*/ConfiShare-*-Setup.exe
          draft: false
          prerelease: false

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Preflight Apple signing configuration
        env:
          CERT_P12: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          MISSING=0
          [ -n "$CERT_P12" ] || { echo "::error::Missing secret MAC_CERTIFICATE_P12_BASE64"; MISSING=1; }
          [ -n "$CERT_PW" ] || { echo "::error::Missing secret MAC_CERTIFICATE_PASSWORD"; MISSING=1; }
          [ -n "$APPLE_ID" ] || { echo "::error::Missing secret APPLE_ID"; MISSING=1; }
          [ -n "$APPLE_PW" ] || { echo "::error::Missing secret APPLE_APP_SPECIFIC_PASSWORD"; MISSING=1; }
          [ -n "$TEAM_ID" ] || { echo "::error::Missing secret APPLE_TEAM_ID"; MISSING=1; }
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::All Apple signing/notarization secrets are required for production macOS releases (cert p12 + password + Apple ID + app-specific password + Team ID)."
            exit 1
          fi
          {
            echo "CSC_LINK=$CERT_P12"
            echo "CSC_KEY_PASSWORD=$CERT_PW"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PW"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signed + notarized build configured"

      - name: Install dependencies
        run: |
          # Do NOT use --omit=optional here: dmg-license is an optional darwin-only
          # dep that the dmg target requires. npm already filters optional deps by
          # platform, so the full install is correct on macOS.
          npm ci
          npm install --no-save @rollup/rollup-darwin-arm64@4.57.1 lightningcss-darwin-arm64@1.30.2 @tailwindcss/oxide-darwin-arm64@4.1.18

      - name: Compile macOS app
        run: |
          npx --no-install tsc
          npx --no-install vite build

      - name: Build macOS app (x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --mac dmg --x64 --publish never

      - name: Build macOS app (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --mac dmg --arm64 --publish never

      - name: Build macOS app (universal)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --mac dmg --universal --publish never

      - name: Notarize and staple macOS DMGs
        run: |
          set -e
          for DMG in release/*/ConfiShare-Mac-*-Installer.dmg; do
            [ -f "$DMG" ] || continue
            echo "::group::Notarize $DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            echo "::endgroup::"
            echo "::group::Staple $DMG"
            xcrun stapler staple "$DMG"
            echo "::endgroup::"
          done

      - name: Verify signing, notarization, and architectures
        run: |
          set -e

          DMG_COUNT=$(ls release/*/ConfiShare-Mac-*-Installer.dmg 2>/dev/null | wc -l | tr -d ' ')
          echo "macOS DMG count: $DMG_COUNT"
          [ "$DMG_COUNT" -ge 3 ] || { echo "::error::Expected x64, arm64 and universal DMGs, found $DMG_COUNT"; exit 1; }
          UNIVERSAL_DMG=$(ls release/*/ConfiShare-Mac-*-universal-Installer.dmg 2>/dev/null | head -n1 || true)
          [ -n "$UNIVERSAL_DMG" ] || { echo "::error::Universal DMG was not produced"; exit 1; }

          FOUND_APP=0
          for APP in release/*/mac*/ConfiShare.app; do
            [ -d "$APP" ] || continue
            FOUND_APP=$((FOUND_APP + 1))
            ARCHS=$(lipo -archs "$APP/Contents/MacOS/ConfiShare")
            echo "::group::$APP architectures ($ARCHS)"
            case "$APP" in
              *mac-universal*)
                for ARCH in x86_64 arm64; do
                  case " $ARCHS " in
                    *" $ARCH "*) ;;
                    *) echo "::error::Universal app $APP is missing $ARCH"; exit 1 ;;
                  esac
                done
                ;;
              *mac-arm64*)
                case " $ARCHS " in
                  *" arm64 "*) ;;
                  *) echo "::error::arm64 app $APP is missing arm64"; exit 1 ;;
                esac
                ;;
              *)
                case " $ARCHS " in
                  *" x86_64 "*) ;;
                  *) echo "::error::x64 app $APP is missing x86_64"; exit 1 ;;
                esac
                ;;
            esac
            echo "::endgroup::"
            echo "::group::codesign (strict) $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            echo "---"
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|format|flags|Sealed Resources"
            echo "::endgroup::"
            echo "::group::spctl $APP"
            spctl --assess --type execute --verbose=4 "$APP"
            echo "::endgroup::"
            echo "::group::stapler $APP"
            xcrun stapler validate "$APP"
            echo "::endgroup::"
          done
          [ "$FOUND_APP" -ge 3 ] || { echo "::error::Expected x64, arm64 and universal .app bundles, found $FOUND_APP"; exit 1; }

          FOUND_DMG=0
          for DMG in release/*/ConfiShare-Mac-*-Installer.dmg; do
            [ -f "$DMG" ] || continue
            FOUND_DMG=$((FOUND_DMG + 1))
            echo "::group::hdiutil verify $DMG"
            hdiutil verify "$DMG"
            echo "::endgroup::"
            echo "::group::stapler $DMG"
            xcrun stapler validate "$DMG"
            echo "::endgroup::"
            echo "::group::spctl $DMG"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
            echo "::endgroup::"
          done
          [ "$FOUND_DMG" -ge 3 ] || { echo "::error::Expected 3 DMGs, found $FOUND_DMG"; exit 1; }
          ls -lh release/*/ConfiShare-Mac-*-Installer.dmg release/*/mac*/ConfiShare.app

      - name: Generate SHA-256 checksums
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          cd "release/$VERSION"
          shasum -a 256 ConfiShare-Mac-*-Installer.dmg > "ConfiShare-Mac-$VERSION-SHA256SUMS.txt"
          cat "ConfiShare-Mac-$VERSION-SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: confishare-macos-dmg
          path: |
            release/*/ConfiShare-Mac-*-Installer.dmg
            release/*/ConfiShare-Mac-*-SHA256SUMS.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            release/*/ConfiShare-Mac-*-Installer.dmg
            release/*/ConfiShare-Mac-*-SHA256SUMS.txt
          draft: false
          prerelease: false

      - name: Add rebuild provenance note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          SHA="${{ github.sha }}"
          BODY=$(gh release view "$TAG" --json body --jq .body || true)
          BODY=$(printf '%s\n' "$BODY" | sed '/^<!-- rebuild-provenance -->$/,$d')
          {
            printf '%s\n' "$BODY"
            echo
            echo '<!-- rebuild-provenance -->'
            echo '### Rebuilt installers'
            echo
            echo "macOS (x64, arm64, universal), Windows, and Linux installers attached to this release were rebuilt from commit [\`${SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}) on $(date -u +'%Y-%m-%d %H:%M UTC'). The \`$TAG\` tag was not moved and still identifies its original commit."
          } > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=optional
          npm install --no-save --omit=optional @rollup/rollup-linux-x64-gnu@4.57.1 lightningcss-linux-x64-gnu@1.30.2 @tailwindcss/oxide-linux-x64-gnu@4.1.18

      - name: Build Linux AppImage
        run: npm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: confishare-linux-appimage
          path: release/*/ConfiShare-*.AppImage

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release/*/ConfiShare-*.AppImage
          draft: false
          prerelease: false
