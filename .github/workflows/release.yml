name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach builds to (used only for manual runs)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=optional
          npm install --no-save --omit=optional @rollup/rollup-win32-x64-msvc@4.57.1 lightningcss-win32-x64-msvc@1.30.2 @tailwindcss/oxide-win32-x64-msvc@4.1.18

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: confishare-windows-installer
          path: release/*/ConfiShare-*-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*/ConfiShare-*-Setup.exe
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=optional
          npm install --no-save --omit=optional @rollup/rollup-linux-x64-gnu@4.57.1 lightningcss-linux-x64-gnu@1.30.2 @tailwindcss/oxide-linux-x64-gnu@4.1.18

      - name: Build Linux AppImage
        run: npm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: confishare-linux-appimage
          path: release/*/ConfiShare-*.AppImage

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release/*/ConfiShare-*.AppImage
          draft: false
          prerelease: false
